<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cannon Shooter Physics Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header>
      <h1>Cannon Shooter Physics Demo</h1>
      <p>
        Enter the target position, cannon angle, initial velocity, and gravity. Then press
        <strong>Play</strong> to launch the cannonball.
      </p>
    </header>

    <section class="controls">
      <div class="control-group">
        <label for="target-x">Target X (m)</label>
        <input id="target-x" type="number" step="0.1" value="120" />
      </div>
      <div class="control-group">
        <label for="target-y">Target Y (m)</label>
        <input id="target-y" type="number" step="0.1" value="40" />
      </div>
      <div class="control-group">
        <label for="angle">Angle (degrees)</label>
        <input id="angle" type="number" step="0.1" value="45" />
      </div>
      <div class="control-group">
        <label for="velocity">Initial Velocity (m/s)</label>
        <input id="velocity" type="number" step="0.1" value="60" />
      </div>
      <div class="control-group">
        <label for="gravity">Gravity (m/s²)</label>
        <input id="gravity" type="number" step="0.1" value="9.81" />
      </div>
      <div class="control-actions">
        <button id="play">Play</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </section>

    <section class="canvas-wrapper">
      <canvas id="scene" width="900" height="560" aria-label="Cannonball simulation"></canvas>
      <div class="legend">
        <div><span class="legend-swatch cannon"></span>Cannon</div>
        <div><span class="legend-swatch target"></span>Target (1 m diameter)</div>
        <div><span class="legend-swatch ball"></span>Cannonball</div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
